name: 💡 Sugestão
description: Uma ideia ou melhoria para esta versão
title: "[Sugestão] "
labels: ["enhancement"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a ideia?
      placeholder: "Ex.: suporte a controle com vibração."
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Por que seria útil?
    validations:
      required: false
